<template id="t0"><h1 class="a">Primer sitio de Montevideo, Armisticio de Octubre y Éxodo del Pueblo Oriental</h1><p class="a">1811</p><div class="hint a">Usá las flechas del teclado o deslizá para recorrer la sala.</div></template>

<template id="t1"><div class="sala a">I.</div><h2 class="a">Primer sitio de Montevideo</h2>
<p class="a">En febrero de 1811 comenzó la revolución en la campaña oriental con el <b>Grito de Asencio</b>. Artigas se puso al frente del movimiento y el <b>18 de mayo de 1811</b> venció a los españoles en la <b>Batalla de Las Piedras</b>.</p>
<p class="a">Después, los orientales y las tropas de Buenos Aires al mando de <b>Rondeau</b> sitiaron Montevideo. Era el último reducto español en la región y lo gobernaba el virrey <b>Elío</b>.</p>
<div class="cartela a"><strong>Carga de caballería</strong>Óleo · campaña oriental<br><small>Primer sitio de Montevideo</small></div></template>

<template id="t2"><div class="sala a">II.</div><h2 class="a">La invasión portuguesa</h2>
<p class="a">Elío, sin salida, pidió ayuda a Portugal. En <b>julio de 1811</b> un ejército portugués al mando de <b>Diego de Souza</b> invadió la Banda Oriental con la excusa de "pacificarla".</p>
<p class="a">En realidad buscaba quedarse con el territorio.</p>
<div class="cartela a"><strong>La Banda Oriental</strong>Mapa de la segunda campaña, 1812-1814<br><small>Montevideo, el río Uruguay y Entre Ríos</small></div></template>

<template id="t3"><div class="sala a">III.</div><h2 class="a">Armisticio de Octubre</h2>
<p class="a">20 de octubre de 1811. Buenos Aires estaba en una situación difícil: había perdido en <b>Huaqui</b>, en el Alto Perú, y temía el avance portugués. Por eso, sin consultar a los orientales, firmó un tratado con Elío que establecía:</p>
<ul class="terms a"><li><span>I</span>levantar el sitio de Montevideo;</li><li><span>II</span>devolver la Banda Oriental y parte de Entre Ríos al dominio español;</li><li><span>III</span><div>la retirada de las tropas portuguesas.<em>En la práctica no se cumplió.</em></div></li></ul></template>

<template id="t4"><div class="sala a">IV.</div><h2 class="a">Jefe de los Orientales</h2>
<p class="a">Para los orientales el armisticio fue una traición, porque se entregaba el territorio que habían liberado.</p>
<p class="a">Días antes, en la <b>Asamblea de la Quinta de la Paraguaya</b> (10 de octubre), rechazaron el acuerdo y nombraron a Artigas "Jefe de los Orientales". Fue la primera vez que el pueblo oriental eligió a su propio líder.</p>
<div class="cartela a"><strong>Artigas en la Ciudadela</strong>Juan Manuel Blanes, 1884<br><small>Óleo sobre tela</small></div></template>

<template id="t5"><div class="sala a">V.</div><h2 class="a">El Éxodo del Pueblo Oriental</h2>
<p class="a">Lo llamaron "La Redota". Artigas decidió retirarse hacia el norte con su ejército, y gran parte de la población lo siguió por voluntad propia.</p>
<p class="a">Iban familias, gauchos, indígenas, esclavos y hacendados, con carretas, ganado y lo poco que podían cargar. Eran <b>unas 16.000 personas</b>. Muchos quemaron sus casas y campos para no dejárselos al enemigo.</p>
<div class="cartela a"><strong>Éxodo del Pueblo Oriental</strong>Mural, 1950<br><small>Témpera</small></div></template>

<template id="t6"><div class="sala a">VI.</div><h2 class="a">El campamento del Ayuí</h2>
<p class="a">Cruzaron el río Uruguay por el <b>Salto Chico</b> y acamparon en el <b>Ayuí</b>, en Entre Ríos. Allí vivieron en malas condiciones durante meses.</p>
<ul class="tl a"><li><span>Feb. 1811</span>Grito de Asencio</li><li><span>18 may.</span>Batalla de Las Piedras</li><li><span>Jul.</span>Invasión portuguesa</li><li><span>10 oct.</span>Quinta de la Paraguaya</li><li><span>20 oct.</span>Armisticio de Octubre</li><li><span>Después</span>Éxodo y campamento del Ayuí</li></ul>
<div class="cartela a"><strong>Asamblea artiguista</strong>Lámina conmemorativa, 1951<br><small>Ilustración escolar</small></div></template>

const tex=(draw,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};
const noise=(g,w,h,a)=>{for(let i=0;i<w*h/30;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:200},0,${Math.random()*a})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}};
// pared de terciopelo, zócalo y piso de tablas
const wallT=tex((g,w,h)=>{g.fillStyle='#4a211c';g.fillRect(0,0,w,h);noise(g,w,h,.06);for(let x=0;x<w;x+=64){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(x,0,32,h)}},512,512);wallT.wrapS=wallT.wrapT=THREE.RepeatWrapping;wallT.repeat.set(10,2);
const floorT=tex((g,w,h)=>{for(let y=0;y<h;y+=32){g.fillStyle=`hsl(25,${35+Math.random()*10}%,${14+Math.random()*6}%)`;g.fillRect(0,y,w,31);g.fillStyle='#120806';g.fillRect(0,y+31,w,1);g.fillRect(Math.random()*w,y,1,32)}noise(g,w,h,.08)},512,512);floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping;floorT.repeat.set(12,4);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(140,16),new THREE.MeshStandardMaterial({map:wallT,roughness:.95}));wall.position.set(30,3,0);S.add(wall);
const dado=new THREE.Mesh(new THREE.BoxGeometry(140,1.6,.25),new THREE.MeshStandardMaterial({color:0x2a140f,roughness:.6}));dado.position.set(30,-4.2,.1);S.add(dado);
const rail=new THREE.Mesh(new THREE.BoxGeometry(140,.1,.3),new THREE.MeshStandardMaterial({color:0x3a2416,roughness:.7}));rail.position.set(30,-3.35,.12);S.add(rail);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(140,40),new THREE.MeshStandardMaterial({map:floorT,roughness:.55}));floor.rotation.x=-Math.PI/2;floor.position.set(30,-5,18);S.add(floor);
S.add(new THREE.HemisphereLight(0xffe2b8,0x1a0a06,.35));
// marcos dorados
const gold=new THREE.MeshStandardMaterial({color:0x8e6a32,metalness:.7,roughness:.55});const goldD=new THREE.MeshStandardMaterial({color:0x4a3418,metalness:.5,roughness:.7});
const liner=new THREE.MeshStandardMaterial({color:0x1d120b,roughness:.9});
function frame(w,h,b){const g=new THREE.Group();const s=new THREE.Shape();s.moveTo(-w/2-b,-h/2-b);s.lineTo(w/2+b,-h/2-b);s.lineTo(w/2+b,h/2+b);s.lineTo(-w/2-b,h/2+b);
 const hole=new THREE.Path();hole.moveTo(-w/2,-h/2);hole.lineTo(-w/2,h/2);hole.lineTo(w/2,h/2);hole.lineTo(w/2,-h/2);s.holes.push(hole);
 const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.18,bevelEnabled:true,bevelSize:b*.35,bevelThickness:.12,bevelSegments:3}),gold);g.add(m);
 const s2=new THREE.Shape();s2.moveTo(-w/2,-h/2);s2.lineTo(w/2,-h/2);s2.lineTo(w/2,h/2);s2.lineTo(-w/2,h/2);const h2=new THREE.Path();const k=.12;h2.moveTo(-w/2+k,-h/2+k);h2.lineTo(-w/2+k,h/2-k);h2.lineTo(w/2-k,h/2-k);h2.lineTo(w/2-k,-h/2+k);s2.holes.push(h2);
 const l=new THREE.Mesh(new THREE.ShapeGeometry(s2),goldD);l.position.z=.06;g.add(l);return g}
const loader=new THREE.TextureLoader();
function plaque(lines){return tex((g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#2b1c12');gr.addColorStop(1,'#140c07');g.fillStyle=gr;g.fillRect(0,0,w,h);noise(g,w,h,.05);
 g.strokeStyle='#c9a24a';g.lineWidth=4;g.strokeRect(40,40,w-80,h-80);g.lineWidth=1.5;g.strokeRect(56,56,w-112,h-112);g.textAlign='center';
 lines.forEach(([t,f,y,c])=>{g.font=f;g.fillStyle='rgba(0,0,0,.6)';g.fillText(t,w/2+2,y+3);g.fillStyle=c;g.fillText(t,w/2,y)})},1024,640)}
const P=[
 {t:plaque([['MDCCCXI','400 40px "IM Fell English SC"',150,'#c9a24a'],['La Redota','400 150px "IM Fell English"',330,'#efe4cc'],['Banda Oriental','400 44px "IM Fell English SC"',440,'#c9a24a'],['sitio · armisticio · éxodo','400 30px "IM Fell English SC"',505,'#a88a55']]),a:1.6,h:4.2,title:1},
 {img:IMG_carga,h:3.4},{img:IMG_mapa,h:4.4},
 {t:plaque([['20 de octubre','400 52px "IM Fell English SC"',200,'#c9a24a'],['Armisticio','400 150px "IM Fell English"',370,'#efe4cc'],['MDCCCXI','400 40px "IM Fell English SC"',470,'#a88a55']]),a:1.6,h:3.4},
 {img:IMG_artigas,h:5.6},{img:IMG_exodo,h:4.4},{img:IMG_asamblea,h:3.8}
];
const GAP=11;
P.forEach((p,i)=>{const t=p.t||loader.load(p.img,tt=>{tt.encoding=THREE.sRGBEncoding;tt.anisotropy=8;const a=tt.image.width/tt.image.height;p.mesh.scale.x=a/p.a;fit()});
 p.a=p.a||1.4;const w=p.h*p.a;p.x=i*GAP;p.y=p.title?1.2:.6;
 const grp=new THREE.Group();grp.position.set(p.x,p.y,.05);
 p.mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,p.h),new THREE.MeshStandardMaterial({map:t,roughness:.75}));p.mesh.position.z=.12;grp.add(p.mesh);
 p.grp=grp;S.add(grp);
 const sp=new THREE.SpotLight(0xffdcae,0,18,.5,.95,1.2);sp.position.set(p.x,p.y+5.5,5);sp.target.position.set(p.x,p.y,0);S.add(sp,sp.target);p.light=sp});
function rebuildFrame(p){if(p.fr)p.grp.remove(p.fr);const w=p.mesh.geometry.parameters.width*p.mesh.scale.x;p.w=w;p.fr=frame(w,p.h,.42);p.grp.add(p.fr)}
P.forEach(rebuildFrame);
function fit(){P.forEach(p=>{if(p.fr&&Math.abs(p.w-p.mesh.geometry.parameters.width*p.mesh.scale.x)>.01)rebuildFrame(p)})}
// encuadre: el cuadro queda a la derecha (escritorio) o arriba (celular)
const look=new THREE.Vector3();let mobile=false,off={x:0,y:0};
function shot(i){const p=P[i],asp=innerWidth/innerHeight,tn=Math.tan(THREE.MathUtils.degToRad(20)),W=p.w+1.1,H=p.h+1.1;let d,ox=0,oy=0;
 if(p.title){d=Math.max(H/.62,W/(.82*asp))/(2*tn);oy=mobile?.1:.07}
 else if(mobile){d=Math.max(H/.36,W/(.86*asp))/(2*tn);oy=.29}
 else{d=Math.max(H/.74,W/(.42*asp))/(2*tn);ox=-.21}
 return{x:p.x,y:p.y,z:d,ox,oy}}
function applyOff(){const w=innerWidth,h=innerHeight;C.setViewOffset(w,h,off.x*w,off.y*h,w,h)}
function size(){mobile=innerWidth<=760||innerWidth/innerHeight<.8;R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;applyOff();C.updateProjectionMatrix();if(cur>=0){const s=shot(cur);C.position.set(s.x,s.y,s.z);look.set(s.x,s.y,0);off.x=s.ox;off.y=s.oy;applyOff()}}
let cur=-1,busy=false,mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
C.position.set(-14,1.5,22);look.set(0,1,0);size();addEventListener('resize',size);
(function loop(){const px=C.position.x,py=C.position.y;C.position.x+=mx*.25;C.position.y-=my*.15;C.lookAt(look);applyOff();C.updateProjectionMatrix();R.render(S,C);C.position.x=px;C.position.y=py;requestAnimationFrame(loop)})();
// HTML
const panel=document.getElementById('panel'),shade=document.getElementById('shade'),dots=document.getElementById('dots');
const roman=['','I','II','III','IV','V','VI'];

function go(n){if(busy||n<0||n>=P.length||n===cur)return;busy=true;const from=cur;cur=n;
 dots.textContent=n?(roman[n]+' de VI'):'portada';document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===P.length-1;
 const s=shot(n),tl=gsap.timeline({onComplete:()=>busy=false});
 // salida del texto
 tl.to(panel,{opacity:0,marginTop:24,duration:.45,ease:'power2.in'});
 tl.add(()=>{shade.classList.remove('on')},0);
 if(from>=0)tl.to(P[from].light,{intensity:.6,duration:1},0);
 // la cámara se aleja, camina por la sala y se acerca al cuadro
 const mid=from<0?0:(P[from].x+s.x)/2;
 tl.to(off,{x:0,y:0,duration:1,ease:'power2.inOut'},0)
   .to(C.position,{x:mid,y:1.6,z:Math.max(s.z,13)+3,duration:1.1,ease:'power2.inOut'},0)
   .to(look,{x:mid+(s.x-mid)*.6,y:.8,duration:1.1,ease:'power2.inOut'},0)
   .to(P[n].light,{intensity:3.2,duration:1.4},.6)
   .to(C.position,{x:s.x,y:s.y,z:s.z,duration:1.5,ease:'power3.inOut'},1)
   .to(look,{x:s.x,y:s.y,duration:1.5,ease:'power3.inOut'},1)
   .to(off,{x:s.ox,y:s.oy,duration:1.4,ease:'power3.inOut'},1.1)
   .add(()=>{panel.innerHTML=document.getElementById('t'+n).innerHTML;document.body.classList.toggle('title-view',!!P[n].title);if(!P[n].title)shade.classList.add('on');
     gsap.fromTo(panel,{opacity:0,marginTop:36},{opacity:1,marginTop:0,duration:.9,ease:'power3.out'});
     },2.1);
}
document.getElementById('next').onclick=()=>go(cur+1);document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1)});
let wl=0;addEventListener('wheel',e=>{if(e.target.closest('.panel')&&panel.scrollHeight>panel.clientHeight)return;const t=Date.now();if(t-wl<1200||Math.abs(e.deltaY)<20)return;wl=t;go(cur+(e.deltaY>0?1:-1))},{passive:true});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));sx=null});
document.getElementById('loading').classList.add('gone');
go(0);
})();
</script>
